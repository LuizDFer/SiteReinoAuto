[project]
name = "sitereinoauto"
version = "0.1.0"
description = "Site institucional da Reino Auto Estética Automotiva"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP", "S", "C4"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
